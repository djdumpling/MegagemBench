[project]
name = "megagem"
description = "MegaGem: a 3-player general-sum auction game with private information (based on a Jane Street game), plus the training and evaluation pipeline for LLM agents that play it"
version = "0.1.0"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["auction", "multi-agent", "reinforcement-learning", "llm", "game", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "verifiers>=0.1.5.post0",
    "datasets>=3.0.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "numpy>=1.26,<2.3",
    # Unpickles the shipped selector artifacts; pickles are not stable across
    # sklearn minor versions, so this tracks the version they were fit with.
    "scikit-learn~=1.8.0",
]

[project.optional-dependencies]
# Drive the Modal apps (modal_play.py, modal_train.py, ...) from your machine.
play = ["modal>=1.0"]
# TrueSkill ratings in scripts/eval (local_trio_eval, _aggregate_qwen_eval)
# and the dynamics-sweep plotter in scripts/analysis.
eval = ["trueskill>=0.4.5", "matplotlib>=3.8", "seaborn>=0.13"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# NOTE: there is deliberately no `rl` extra. The GRPO/distill training stack
# (torch/trl/peft/accelerate/wandb) runs inside the Modal image, which rebuilds
# the required TRL fork from public upstream (see docs/training.md and
# scripts/training/setup_trl_fork.sh). All training imports are lazy, so the
# package installs and its CPU tests pass without them.

[project.urls]
Homepage = "https://github.com/djdumpling/MegagemBench"
Repository = "https://github.com/djdumpling/MegagemBench"
"Write-up" = "https://djdumpling.github.io/2026/07/25/my-draft.html"
Model = "https://huggingface.co/djdumpling/qwen3-4b-instruct-megagem-distill-para"
Dataset = "https://huggingface.co/datasets/djdumpling/megagem_sft"

[project.scripts]
megagem-run = "megagem.rollout:main"
megagem-play = "megagem.play.interactive:main"
megagem-play-distilled = "megagem.play.distilled:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megagem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Verifiers env-hub metadata: this package doubles as the `megagem` verifiers
# environment (megagem.load_environment). Install with `prime env install .`.
[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 4
